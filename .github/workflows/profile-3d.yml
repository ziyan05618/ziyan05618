# 3D 贡献图 —— 生成后提交到 main 分支的 profile-3d-contrib/ 目录
#
# 使用前必做：
#   仓库 → Settings → Actions → General → Workflow permissions
#   → 选 "Read and write permissions" → Save
#
# 如果推送仍失败，改用 PAT：
#   1. github.com/settings/tokens → Generate new token (classic) → 勾选 scope: repo
#   2. 仓库 → Settings → Secrets and variables → Actions → New repository secret
#      Name: TOKEN   Value: <粘贴 token>
#   3. 把下面两处 GITHUB_TOKEN 换成 secrets.TOKEN
#
# 首次生成：Actions → Generate 3D Contribution Graph → Run workflow
# 产物地址：
#   https://raw.githubusercontent.com/ziyan05618/ziyan05618/main/profile-3d-contrib/profile-night-rainbow.svg

name: Generate 3D Contribution Graph

on:
  # 每天 UTC 18:00（北京时间次日 02:00）自动更新
  schedule:
    - cron: "0 18 * * *"
  # 允许手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # github.repository_owner 自动取仓库所有者，无需手改用户名
      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "chore: update 3D contribution graph" || exit 0
          git push
